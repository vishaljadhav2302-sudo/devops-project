<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Capstone Project</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #333; }
        #status { margin-top: 20px; font-weight: bold; color: blue; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My DevOps Capstone App</h1>
        <p>This is a full-stack application deployed on AWS.</p>
        <button onclick="checkStatus()">Check System Status</button>
        <p id="status"></p>
    </div>

    <script>
        async function checkStatus() {
            const statusText = document.getElementById('status');
            statusText.innerText = "Checking...";
            try {
                // In Docker, we will map this to the backend service
                const response = await fetch('/api/status'); 
                const data = await response.json();
                statusText.innerText = data.message;
                statusText.style.color = "green";
            } catch (error) {
                statusText.innerText = "Failed to connect to backend API.";
                statusText.style.color = "red";
            }
        }
    </script>
</body>
</html>
